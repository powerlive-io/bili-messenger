name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install libcurl via vcpkg
        if: runner.os == 'Windows'
        run: vcpkg install curl:x64-windows

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBM_BUILD_TESTS=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DBM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -V

  coverage:
    name: Application line coverage
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gcovr==8.6
      - run: sh tests/coverage.sh
        env:
          GCOV: xcrun llvm-cov gcov
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: line-coverage
          path: build/coverage.html
          if-no-files-found: ignore
